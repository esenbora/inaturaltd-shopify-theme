name: Blog Cron

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: blog-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blog-engine/package-lock.json

      - name: Restore processed ledger
        uses: actions/cache/restore@v4
        with:
          path: blog-engine/processed.json
          key: blog-processed-${{ github.run_id }}
          restore-keys: |
            blog-processed-

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish blog articles
        run: npm start
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_BLOG_HANDLE: ${{ secrets.SHOPIFY_BLOG_HANDLE }}
          BATCH: ${{ vars.BATCH || '2' }}

      - name: Ensure ledger exists
        if: always()
        run: test -f processed.json || printf '{"version":1,"posts":{}}\n' > processed.json

      - name: Save processed ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: blog-engine/processed.json
          key: blog-processed-${{ github.run_id }}
